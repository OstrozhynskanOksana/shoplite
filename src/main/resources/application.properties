spring.application.name=shoplite

# By default the app uses an in-memory H2 database (PostgreSQL compatibility mode),
# so it starts without any extra setup.
# To use PostgreSQL, run with the "postgres" profile (see README).
spring.datasource.url=jdbc:h2:mem:shoplite;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=

# The schema is managed by Flyway (src/main/resources/db/migration)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration

spring.thymeleaf.cache=false
server.error.whitelabel.enabled=false
