<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Log in')}"></head>
<body>
<nav th:replace="~{fragments/layout :: header}"></nav>
<main class="container auth-box">
    <h1 class="h4 mb-3">Log in</h1>
    <div th:if="${param.registered}" class="alert alert-success">Registration successful. Please log in.</div>
    <div th:if="${param.error}" class="alert alert-danger">Invalid email or password.</div>
    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label class="form-label" for="email">Email</label>
            <input class="form-control" type="email" id="email" name="email" required autofocus>
        </div>
        <div class="mb-3">
            <label class="form-label" for="password">Password</label>
            <input class="form-control" type="password" id="password" name="password" required>
        </div>
        <button class="btn btn-primary w-100" type="submit">Log in</button>
    </form>
    <p class="small mt-3">No account? <a th:href="@{/register}">Sign up</a></p>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
