<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' — ShopLite'">ShopLite</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav th:fragment="header" class="navbar navbar-expand-md bg-body-tertiary border-bottom mb-4">
    <div class="container">
        <a class="navbar-brand fw-semibold" th:href="@{/products}">ShopLite</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav"
                aria-label="Menu"><span class="navbar-toggler-icon"></span></button>
        <div class="collapse navbar-collapse" id="nav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/products}">Catalog</a></li>
                <li class="nav-item" th:if="${isAdmin}"><a class="nav-link" th:href="@{/admin}">Admin</a></li>
            </ul>
            <div class="d-flex align-items-center gap-2" th:if="${currentUserEmail == null}">
                <a class="btn btn-outline-secondary btn-sm" th:href="@{/login}">Log in</a>
                <a class="btn btn-primary btn-sm" th:href="@{/register}">Sign up</a>
            </div>
            <div class="d-flex align-items-center gap-2" th:if="${currentUserEmail != null}">
                <span class="small text-secondary" th:text="${currentUserEmail}">user@example.com</span>
                <form th:action="@{/logout}" method="post" class="m-0">
                    <button class="btn btn-outline-secondary btn-sm" type="submit">Log out</button>
                </form>
            </div>
        </div>
    </div>
</nav>
<footer th:fragment="footer" class="border-top mt-5 py-4 text-center small text-secondary">
    ShopLite — a student project for the Software Development Life Cycle course
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</footer>
</body>
</html>
