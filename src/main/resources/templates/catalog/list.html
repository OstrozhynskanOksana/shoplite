<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Catalog')}"></head>
<body>
<nav th:replace="~{fragments/layout :: header}"></nav>
<main class="container">
    <div th:if="${param.logout}" class="alert alert-info">You have been logged out.</div>

    <form class="row g-2 mb-4" method="get" th:action="@{/products}">
        <div class="col-12 col-md-5">
            <input class="form-control" type="search" name="q" th:value="${filter.query}"
                   placeholder="Search by name">
        </div>
        <div class="col-6 col-md-3">
            <select class="form-select" name="category">
                <option value="">All categories</option>
                <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"
                        th:selected="${filter.categoryId == c.id}">Category</option>
            </select>
        </div>
        <div class="col-6 col-md-2">
            <select class="form-select" name="sort">
                <option value="">By name</option>
                <option value="price_asc" th:selected="${filter.sort == 'price_asc'}">Price ↑</option>
                <option value="price_desc" th:selected="${filter.sort == 'price_desc'}">Price ↓</option>
            </select>
        </div>
        <div class="col-12 col-md-2 d-grid">
            <button class="btn btn-primary" type="submit">Search</button>
        </div>
    </form>

    <p th:if="${products.empty}" class="text-secondary">No products found.</p>

    <div class="row g-3">
        <div class="col-12 col-sm-6 col-lg-3" th:each="p : ${products}">
            <div class="card h-100">
                <div class="card-img-top product-thumb" th:text="${p.category.name}">Category</div>
                <div class="card-body d-flex flex-column">
                    <h2 class="h6 card-title">
                        <a class="stretched-link text-decoration-none" th:href="@{/products/{id}(id=${p.id})}"
                           th:text="${p.name}">Product name</a>
                    </h2>
                    <p class="fw-semibold mb-1" th:text="${#numbers.formatDecimal(p.price, 1, 'COMMA', 2, 'POINT')} + ' UAH'">0.00 UAH</p>
                    <p class="small mb-0 mt-auto" th:classappend="${p.inStock} ? 'text-success' : 'text-danger'"
                       th:text="${p.inStock} ? 'In stock' : 'Out of stock'">In stock</p>
                </div>
            </div>
        </div>
    </div>

    <nav th:if="${products.totalPages > 1}" class="mt-4" aria-label="Pages">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:each="i : ${#numbers.sequence(0, products.totalPages - 1)}"
                th:classappend="${i == products.number} ? 'active'">
                <a class="page-link"
                   th:href="@{/products(q=${filter.query}, category=${filter.categoryId}, sort=${filter.sort}, page=${i})}"
                   th:text="${i + 1}">1</a>
            </li>
        </ul>
    </nav>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
