<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Sales — Admin')}"></head>
<body>
<nav th:replace="~{fragments/layout :: header}"></nav>
<main class="container">
    <h1 class="h4 mb-3">Admin panel</h1>
    <ul th:replace="~{fragments/admin :: nav('stats')}"></ul>
    <form th:action="@{/admin/stats}" method="get" class="d-flex gap-2 mb-4" style="max-width: 320px">
        <input class="form-control" type="month" name="month" th:value="${month}" aria-label="Month">
        <button class="btn btn-outline-secondary" type="submit">Show</button>
    </form>
    <div class="row g-3" style="max-width: 640px">
        <div class="col-6">
            <div class="border rounded p-3">
                <div class="small text-secondary">Orders</div>
                <div class="fs-3 fw-semibold" th:text="${sales.ordersCount}">0</div>
            </div>
        </div>
        <div class="col-6">
            <div class="border rounded p-3">
                <div class="small text-secondary">Revenue, UAH</div>
                <div class="fs-3 fw-semibold" th:text="${#numbers.formatDecimal(sales.revenue, 1, 'COMMA', 2, 'POINT')}">0.00</div>
            </div>
        </div>
    </div>
    <p class="small text-secondary mt-3">Cancelled orders are not counted.</p>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
