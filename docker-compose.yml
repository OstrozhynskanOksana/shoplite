# Runs ShopLite with PostgreSQL: docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shoplite
      POSTGRES_USER: shoplite
      POSTGRES_PASSWORD: ${DB_PASSWORD:-shoplite}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shoplite -d shoplite"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://db:5432/shoplite
      DB_USERNAME: shoplite
      DB_PASSWORD: ${DB_PASSWORD:-shoplite}
    ports:
      - "8080:8080"

volumes:
  pgdata:
